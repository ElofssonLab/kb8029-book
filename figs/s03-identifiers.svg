<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-labelledby="title desc">
  <title id="title">One gene symbol can lead to several kinds of record</title>
  <desc id="desc">The human HBB gene symbol leads to NCBI Gene record 3043, RefSeq transcript NM_000518.5 and UniProt protein record P68871.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8z" fill="#0e766f"/></marker></defs>
  <rect x="1" y="1" width="838" height="218" rx="20" fill="#f4f9fd" stroke="#ccddeb"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <rect x="265" y="18" width="310" height="56" rx="12" fill="#e2f4f1" stroke="#b8dcd8"/>
    <text x="420" y="53" text-anchor="middle" font-size="22" font-weight="700" fill="#0e766f">Human gene symbol HBB</text>
    <path d="M420 74v23M152 113V97h536v16M420 97v16" fill="none" stroke="#0e766f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="24" y="113" width="256" height="88" rx="15" fill="#fff" stroke="#ccddeb"/>
    <text x="152" y="151" text-anchor="middle" font-size="22" font-weight="700" fill="#153558">NCBI Gene</text>
    <text x="152" y="181" text-anchor="middle" font-size="21" font-weight="500" fill="#0e766f">3043</text>
    <rect x="292" y="113" width="256" height="88" rx="15" fill="#fff" stroke="#ccddeb"/>
    <text x="420" y="151" text-anchor="middle" font-size="22" font-weight="700" fill="#153558">RefSeq transcript</text>
    <text x="420" y="181" text-anchor="middle" font-size="21" font-weight="500" fill="#0e766f">NM_000518.5</text>
    <rect x="560" y="113" width="256" height="88" rx="15" fill="#fff" stroke="#ccddeb"/>
    <text x="688" y="151" text-anchor="middle" font-size="22" font-weight="700" fill="#153558">UniProt protein</text>
    <text x="688" y="181" text-anchor="middle" font-size="21" font-weight="500" fill="#0e766f">P68871</text>
  </g>
</svg>

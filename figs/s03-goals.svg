<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-labelledby="title desc">
  <title id="title">Three learning goals</title>
  <desc id="desc">Connect DNA, RNA and protein records, choose a route to retrieve sequences, and trace claims to research studies.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8z" fill="#0e766f"/></marker></defs>
  <rect x="1" y="1" width="838" height="218" rx="20" fill="#f4f9fd" stroke="#ccddeb"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <rect x="24" y="24" width="260" height="172" rx="15" fill="#fff" stroke="#ccddeb"/>
    <circle cx="154" cy="76" r="36" fill="#e2f4f1"/>
    <g transform="translate(129 55)"><path d="M25 16v12M9 28v-4h32v4" fill="none" stroke="#0e766f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="17.5" y="1" width="15" height="15" rx="3" fill="white" stroke="#0e766f" stroke-width="3"/><rect x="1.5" y="28" width="15" height="15" rx="3" fill="white" stroke="#0e766f" stroke-width="3"/><rect x="33.5" y="28" width="15" height="15" rx="3" fill="white" stroke="#0e766f" stroke-width="3"/></g>
    <text x="154" y="143" text-anchor="middle" font-size="23" font-weight="700" fill="#153558">Connect records</text>
    <text x="154" y="171" text-anchor="middle" font-size="18" font-weight="500" fill="#0e766f">DNA, RNA and protein</text>
    <rect x="290" y="24" width="260" height="172" rx="15" fill="#fff" stroke="#ccddeb"/>
    <circle cx="420" cy="76" r="36" fill="#e7effa"/>
    <g transform="translate(396 56)"><path d="M24 1v24m-9-9 9 9 9-9M4 26v13h40V26" fill="none" stroke="#153558" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g>
    <text x="420" y="143" text-anchor="middle" font-size="23" font-weight="700" fill="#153558">Retrieve sequences</text>
    <text x="420" y="171" text-anchor="middle" font-size="18" font-weight="500" fill="#153558">Choose an access route</text>
    <rect x="556" y="24" width="260" height="172" rx="15" fill="#fff" stroke="#ccddeb"/>

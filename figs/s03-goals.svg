    <text x="686" y="143" text-anchor="middle" font-size="23" font-weight="700" fill="#153558">Find and check studies</text>
    <text x="686" y="171" text-anchor="middle" font-size="18" font-weight="500" fill="#9a5b14">Trace claims to sources</text>

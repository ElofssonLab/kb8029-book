<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-labelledby="title desc">
  <title id="title">How a database website reaches its records</title>
  <desc id="desc">A website sends a search to database software, which retrieves organised records. Hardware provides storage and computing.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8z" fill="#0e766f"/></marker></defs>
  <rect x="1" y="1" width="838" height="218" rx="20" fill="#f4f9fd" stroke="#ccddeb"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <rect x="26" y="44" width="213" height="97" rx="15" fill="#fff" stroke="#ccddeb"/>
    <rect x="307" y="44" width="225" height="97" rx="15" fill="#fff" stroke="#ccddeb"/>
    <rect x="600" y="44" width="213" height="97" rx="15" fill="#fff" stroke="#ccddeb"/>
    <path d="M247 93h48" fill="none" stroke="#0e766f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M540 93h48" fill="none" stroke="#0e766f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="132" y="85" text-anchor="middle" font-size="22" font-weight="700" fill="#153558">Database website</text>
    <text x="132" y="113" text-anchor="middle" font-size="18" font-weight="500" fill="#0e766f">Search and view</text>
    <text x="419" y="85" text-anchor="middle" font-size="22" font-weight="700" fill="#153558">Database software</text>
    <text x="419" y="113" text-anchor="middle" font-size="18" font-weight="500" fill="#0e766f">Store and retrieve</text>
    <text x="706" y="85" text-anchor="middle" font-size="22" font-weight="700" fill="#153558">Organised records</text>
    <text x="706" y="113" text-anchor="middle" font-size="18" font-weight="500" fill="#0e766f">Data and fields</text>
    <rect x="156" y="162" width="528" height="37" rx="9" fill="#e6eff8" stroke="#cfdfed"/>
    <text x="420" y="188" text-anchor="middle" font-size="21" font-weight="500" fill="#153558">Hardware provides storage and computing</text>
  </g>
</svg>

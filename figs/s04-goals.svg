  <title id="title">Three learning goals for sequence alignment</title>
  <desc id="desc">Three panels: align two sequences using global and local algorithms; explain scoring with PAM, BLOSUM and gap penalties; build and read multiple sequence alignments using methods, entropy and sequence logos. Icons show aligned residues and a gap, a substitution matrix with a gap, and alignment columns above a small sequence logo.</desc>

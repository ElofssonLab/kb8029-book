<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" role="img" aria-labelledby="title desc"><title id="title">Retrieving a record in code</title><desc id="desc">Use a versioned accession to fetch a record, inspect its named fields, and check the returned sequence and cross-references.</desc><defs><marker id="arrow" viewBox="0 0 9 8" refX="8" refY="4" markerWidth="9" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path fill="#48627c" d="M0 0 L9 4 L0 8 Z"/></marker></defs><rect x="1" y="1" width="838" height="218" rx="16" fill="#f3f8fc" stroke="#d7e6ef" stroke-width="2"/><rect x="30" y="38" width="244" height="112" rx="12" fill="#fff" stroke="#d7e6ef" stroke-width="2"/><circle cx="58" cy="65" r="13" fill="#0e766f" stroke="none" stroke-width="2"/><text x="58" y="70" font-family="system-ui,sans-serif" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="79" y="73" font-family="system-ui,sans-serif" font-size="21" fill="#153558" font-weight="600" text-anchor="start">Retrieve</text><text x="48" y="107" font-family="system-ui,sans-serif" font-size="17" fill="#48627c" font-weight="500" text-anchor="start">Send a versioned</text><text x="48" y="130" font-family="system-ui,sans-serif" font-size="17" fill="#48627c" font-weight="500" text-anchor="start">accession.</text><line x1="278" y1="94" x2="293" y2="94" stroke="#48627c" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="298" y="38" width="244" height="112" rx="12" fill="#fff" stroke="#d7e6ef" stroke-width="2"/><circle cx="326" cy="65" r="13" fill="#0e766f" stroke="none" stroke-width="2"/><text x="326" y="70" font-family="system-ui,sans-serif" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="347" y="73" font-family="system-ui,sans-serif" font-size="21" fill="#153558" font-weight="600" text-anchor="start">Inspect</text><text x="316" y="107" font-family="system-ui,sans-serif" font-size="17" fill="#48627c" font-weight="500" text-anchor="start">Read the sequence</text><text x="316" y="130" font-family="system-ui,sans-serif" font-size="17" fill="#48627c" font-weight="500" text-anchor="start">and named fields.</text><line x1="546" y1="94" x2="561" y2="94" stroke="#48627c" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="566" y="38" width="244" height="112" rx="12" fill="#fff" stroke="#d7e6ef" stroke-width="2"/><circle cx="594" cy="65" r="13" fill="#0e766f" stroke="none" stroke-width="2"/><text x="594" y="70" font-family="system-ui,sans-serif" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="615" y="73" font-family="system-ui,sans-serif" font-size="21" fill="#153558" font-weight="600" text-anchor="start">Check</text><text x="584" y="107" font-family="system-ui,sans-serif" font-size="17" fill="#48627c" font-weight="500" text-anchor="start">Confirm the organism</text><text x="584" y="130" font-family="system-ui,sans-serif" font-size="17" fill="#48627c" font-weight="500" text-anchor="start">and linked records.</text><text x="420" y="187" font-family="system-ui,sans-serif" font-size="18" fill="#9a5b14" font-weight="650" text-anchor="middle">Worked example   NM_000518.5</text></svg>

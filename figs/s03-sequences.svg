<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" role="img" aria-labelledby="title desc"><title id="title">Four sequence forms from HBB</title><desc id="desc">The genomic span includes introns. Spliced RNA joins exons, the coding sequence keeps the start-to-stop region, and translation yields beta-globin.</desc><defs><marker id="arrow" viewBox="0 0 9 8" refX="8" refY="4" markerWidth="9" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path fill="#48627c" d="M0 0 L9 4 L0 8 Z"/></marker></defs><rect x="1" y="1" width="838" height="258" rx="16" fill="#f3f8fc" stroke="#d7e6ef" stroke-width="2"/><text x="28" y="35" font-family="system-ui,sans-serif" font-size="25" fill="#153558" font-weight="600" text-anchor="start">Sequence from one HBB transcript</text><text x="28" y="76" font-family="system-ui,sans-serif" font-size="20" fill="#153558" font-weight="600" text-anchor="start">Genomic span</text><text x="650" y="76" font-family="system-ui,sans-serif" font-size="20" fill="#153558" font-weight="600" text-anchor="start">1,608 bases</text><text x="28" y="116" font-family="system-ui,sans-serif" font-size="20" fill="#153558" font-weight="600" text-anchor="start">Spliced transcript</text><text x="650" y="116" font-family="system-ui,sans-serif" font-size="20" fill="#153558" font-weight="600" text-anchor="start">628 bases</text><text x="28" y="156" font-family="system-ui,sans-serif" font-size="20" fill="#153558" font-weight="600" text-anchor="start">Coding sequence</text><text x="650" y="156" font-family="system-ui,sans-serif" font-size="20" fill="#153558" font-weight="600" text-anchor="start">444 bases</text><text x="28" y="196" font-family="system-ui,sans-serif" font-size="20" fill="#153558" font-weight="600" text-anchor="start">Beta-globin</text><text x="650" y="196" font-family="system-ui,sans-serif" font-size="20" fill="#153558" font-weight="600" text-anchor="start">147 amino acids</text><line x1="250" y1="70" x2="622" y2="70" stroke="#48627c" stroke-w
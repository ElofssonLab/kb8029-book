<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-labelledby="title desc">
<title id="title">AI suggestions are leads to investigate</title>
<desc id="desc">A biological question can produce AI suggestions for terms and papers. Run and verify those leads in a scholarly search service.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8z" fill="#0e766f"/></marker></defs>
<rect x="1" y="1" width="838" height="218" rx="20" fill="#f4f9fd" stroke="#ccddeb"/>
<g font-family="system-ui, Segoe UI, sans-serif">
<rect x="24" y="28" width="222" height="136" rx="14" fill="#fff" stroke="#ccddeb"/>
<text x="135" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#153558">Your question</text>
<text x="135" y="109" text-anchor="middle" font-size="20" font-weight="500" fill="#0e766f">Specific topic</text>
<text x="135" y="137" text-anchor="middle" font-size="20" font-weight="500" fill="#0e766f">and scope</text>
<path d="M256 95h35" fill="none" stroke="#0e766f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="308" y="28" width="224" height="136" rx="14" fill="#e2f4f1" stroke="#b8dcd8"/>
<text x="420" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#153558">AI suggestions</text>
<text x="420" y="109" text-anchor="middle" font-size="20" font-weight="500" fill="#0e766f">Search terms</text>
<text x="420" y="137" text-anchor="middle" font-size="20" font-weight="500" fill="#0e766f">Candidate papers</text>
<path d="M542 95h35" fill="none" stroke="#0e766f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="592" y="28" width="224" height="136" rx="14" fill="#fff" stroke="#ccddeb"/>
<text x="704" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#153558">Scholarly search</text>
<text x="704" y="109" text-anchor="middle" font-size="20" font-weight="500" fill="#0e766f">Run the query</text>
<text x="704" y="137" text-anchor="middle" font-size="20" font-weight="500" fill="#0e766f">Find the records</text>
<text x="420" y="196" text-anchor="middle" font-size="19" font-weight="500" fill="#153558">Save the tool and prompt alongside the search query and date.</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-labelledby="title desc">
  <title id="title">From observations to curated annotations</title>
  <desc id="desc">Observations support analysis, which produces results and predictions. Curators can assess both observations and analysed results when preparing annotations.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8z" fill="#0e766f"/></marker></defs>
  <rect x="1" y="1" width="838" height="218" rx="20" fill="#f4f9fd" stroke="#ccddeb"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <rect x="28" y="33" width="222" height="97" rx="15" fill="#fff" stroke="#ccddeb"/>
    <rect x="309" y="33" width="222" height="97" rx="15" fill="#fff" stroke="#ccddeb"/>
    <rect x="590" y="33" width="222" height="97" rx="15" fill="#fff" stroke="#ccddeb"/>
    <path d="M258 82h39" fill="none" stroke="#0e766f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M539 82h39" fill="none" stroke="#0e766f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="139" y="73" text-anchor="middle" font-size="26" font-weight="700" fill="#153558">Observations</text>
    <text x="139" y="102" text-anchor="middle" font-size="16" font-weight="500" fill="#0e766f">Measurements and images</text>
    <text x="420" y="73" text-anchor="middle" font-size="26" font-weight="700" fill="#153558">Analysis</text>
    <text x="420" y="102" text-anchor="middle" font-size="17" font-weight="500" fill="#0e766f">Results and predictions</text>
    <text x="701" y="73" text-anchor="middle" font-size="26" font-weight="700" fill="#153558">Curation</text>
    <text x="701" y="102" text-anchor="middle" font-size="17" font-weight="500" fill="#0e766f">Evidence and annotations</text>
    <path d="M139 139v26h562v-26" fill="none" stroke="#0e766f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="420" y="198" text-anchor="middle" font-size="20" font-weight="500" fill="#153558">Curators can use measurements and analysis together.</text>
  </g>
</svg>

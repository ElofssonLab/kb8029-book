<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="title desc"><title id="title">Three parts of UniProt</title><desc id="desc">UniProtKB combines sequences and annotations; UniParc archives distinct sequences; UniRef provides sequence clusters.</desc><rect x="1" y="1" width="838" height="298" rx="20" fill="#f4f9fd" stroke="#ccddeb"/><g font-family="system-ui, Segoe UI, sans-serif"><rect x="330" y="18" width="180" height="48" rx="13" fill="#e2f4f1" stroke="#b8dcd8"/><text x="420" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#153558">UniProt</text><path d="M420 66v25M150 110V91h540v19M420 91v19" fill="none" stroke="#0e766f" stroke-width="3"/><rect x="20" y="110" width="260" height="162" rx="15" fill="#fff" stroke="#ccddeb"/><text x="150" y="149" text-anchor="middle" font-size="28" font-weight="700" fill="#153558">UniProtKB</text><text x="150" y="181" text-anchor="middle" font-size="18" fill="#0e766f">Sequences + annotations</text><text x="150" y="223" text-anchor="middle" font-size="18" fill="#153558">Swiss-Prot: reviewed</text><text x="150" y="247" text-anchor="middle" font-size="18" fill="#153558">TrEMBL: unreviewed</text><rect x="290" y="110" width="260" height="162" rx="15" fill="#fff" stroke="#ccddeb"/><text x="420" y="149" text-anchor="middle" font-size="28" font-weight="700" fill="#153558">UniParc</text><text x="420" y="181" text-anchor="middle" font-size="18" fill="#0e766f">Distinct-sequence archive</text><text x="420" y="223" text-anchor="middle" font-size="18" fill="#153558">Source records</text><text x="420" y="247" text-anchor="middle" font-size="18" fill="#153558">and sequence history</text><rect x="560" y="110" width="260" height="162" rx="15" fill="#fff" stroke="#ccddeb"/><text x="690" y="149" text-anchor="middle" font-size="28" font-weight="700" fill="#153558">UniRef</text><text x="690" y="181" text-anchor="middle" font-size="18" fill="#0e766f">Sequence clusters</text><text x="690" y="223" text-anchor="middle" font-size="18" fill="#153558">UniRef100 · UniRef90</text><text x="690" y="247" text-anchor="middle" font-size="18" fill="#153558">UniRef50</text></g></svg>
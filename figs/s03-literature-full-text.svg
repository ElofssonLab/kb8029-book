<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-labelledby="title desc">
<title id="title">From a search result to the paper</title>
<desc id="desc">A search result leads to a citation record. Follow available full-text links and check which version of the paper is open.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8z" fill="#0e766f"/></marker></defs>
<rect x="1" y="1" width="838" height="218" rx="20" fill="#f4f9fd" stroke="#ccddeb"/>
<g font-family="system-ui, Segoe UI, sans-serif">
<rect x="24" y="28" width="222" height="136" rx="14" fill="#fff" stroke="#ccddeb"/>
<text x="135" y="64" text-anchor="middle" font-size="22" font-weight="700" fill="#153558">Search result</text>
<path d="M57 91h155M57 107h127M57 123h143" fill="none" stroke="#b8dcd8" stroke-width="6" stroke-linecap="round"/>
<path d="M256 95h35" fill="none" stroke="#0e766f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="308" y="28" width="224" height="136" rx="14" fill="#fff" stroke="#ccddeb"/>
<text x="420" y="64" text-anchor="middle" font-size="22" font-weight="700" fill="#153558">Citation record</text>
<text x="420" y="100" text-anchor="middle" font-size="18" font-weight="500" fill="#0e766f">Title · authors · year</text>
<text x="420" y="130" text-anchor="middle" font-size="20" font-weight="500" fill="#0e766f">DOI or PMID</text>
<path d="M542 95h35" fill="none" stroke="#0e766f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="592" y="28" width="224" height="136" rx="14" fill="#fff" stroke="#ccddeb"/>
<text x="704" y="64" text-anchor="middle" font-size="22" font-weight="700" fill="#153558">Full text</text>
<text x="704" y="100" text-anchor="middle" font-size="19" font-weight="500" fill="#0e766f">PMC · publisher</text>
<text x="704" y="130" text-anchor="middle" font-size="18" font-weight="500" fill="#0e766f">library · repository</text>
<text x="420" y="196" text-anchor="middle" font-size="19" font-weight="500" fill="#153558">Check whether you are reading the abstract, preprint or final paper.</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-labelledby="title desc"><title id="title">From questions to evidence</title><desc id="desc">Define the question, identify the record, choose an access route and check its supporting evidence.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8z" fill="#0e766f"/></marker></defs><rect x="1" y="1" width="838" height="218" rx="20" fill="#f4f9fd" stroke="#ccddeb"/><g font-family="system-ui, Segoe UI, sans-serif"><rect x="20" y="33" width="185" height="100" rx="15" fill="#fff" stroke="#ccddeb"/><text x="112.5" y="76" text-anchor="middle" font-size="25" font-weight="700" fill="#153558">Question</text><text x="112.5" y="106" text-anchor="middle" font-size="15" fill="#0e766f">What do we need?</text><path d="M208 83h11" fill="none" stroke="#0e766f" stroke-width="2" marker-end="url(#arrow)"/><rect x="225" y="33" width="185" height="100" rx="15" fill="#fff" stroke="#ccddeb"/><text x="317.5" y="76" text-anchor="middle" font-size="25" font-weight="700" fill="#153558">Record</text><text x="317.5" y="106" text-anchor="middle" font-size="15" fill="#0e766f">What does it describe?</text><path d="M413 83h11" fill="none" stroke="#0e766f" stroke-width="2" marker-end="url(#arrow)"/><rect x="430" y="33" width="185" height="100" rx="15" fill="#fff" stroke="#ccddeb"/><text x="522.5" y="76" text-anchor="middle" font-size="25" font-weight="700" fill="#153558">Route</text><text x="522.5" y="106" text-anchor="middle" font-size="15" fill="#0e766f">How will we retrieve it?</text><path d="M618 83h11" fill="none" stroke="#0e766f" stroke-width="2" marker-end="url(#arrow)"/><rect x="635" y="33" width="185" height="100" rx="15" fill="#fff" stroke="#ccddeb"/><text x="727.5" y="76" text-anchor="middle" font-size="25" font-weight="700" fill="#153558">Evidence</text><text x="727.5" y="106" text-anchor="middle" font-size="15" fill="#0e766f">What supports it?</text><text x="420" y="184" text-anchor="middle" font-size="24" font-weight="600" fill="#153558">Find the record. Follow the links. Check the evidence.</text></g></svg>
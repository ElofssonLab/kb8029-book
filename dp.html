<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The alignment matrix &middot; KB8029</title>
<!--
  The dynamic-programming matrix of Sessions 4 and 5, with every setting
  exposed. Linked from the Session 4 deck, so students see this address.

  There is deliberately almost nothing here: the settings bar, the mode
  switcher and the matrix all come from js/dp-matrix.js, which is the same file
  the book pages load and the same file the slide figures are screenshots of.
  A second implementation of the controls would be a second thing to keep true.
-->
<script src="js/dp-matrix.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #1f2933;
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.45rem; margin: 0 0 4px; }
  p.sub { color: #52606d; margin: 0 0 1.5em; }
</style>
</head>
<body>
<main>
  <h1>The alignment matrix</h1>
  <p class="sub">Step through the fill, have it ask you what goes in the next cell, or fill the whole
  grid and have it marked. Change the sequences, the scoring and the gap cost, or press New pair for
  a fresh example.</p>
  <div id="dp"></div>
</main>
<script>
renderDP("dp", {
  controls: true,
  modes: ["step", "guess", "fill"],
  mode: "step",
  a: "TGCATTA", b: "GCATTAC", match: 3, mismatch: -1, gap: -2
});
</script>
</body>
</html>

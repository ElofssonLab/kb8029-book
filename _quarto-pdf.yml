# Profile for the single-PDF version of the course notes (quarto render --profile pdf).
# Only the course pages: the notebooks are linked from the website instead.
project:
  output-dir: _pdf
book:
  output-file: "KB8029-course-notes"
  chapters:
    - index.qmd
    - schedule.qmd
    - course-info.qmd
    - setup.qmd
    - session01.qmd
    - session02.qmd
    - session03.qmd
    - session04.qmd
    - session05.qmd
    - session06.qmd
    - session07.qmd
    - session08.qmd
    - session09.qmd
    - session10.qmd
    - session11.qmd
    - session12.qmd
    - capstone.qmd
    - references.qmd
format:
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    toc: true
    number-sections: true
    colorlinks: true
    mainfont: "DejaVu Serif"
    sansfont: "DejaVu Sans"
    monofont: "DejaVu Sans Mono"
    geometry: margin=2.5cm
    fig-pos: "H"
    filters:
      - pdf-demote-parts.lua

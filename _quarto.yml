project:
  type: book
  resources:
    - js/quiz-widget.js

book:
  title: "Bioinformatics & Deep Learning — Course Notes"
  subtitle: "An open-access companion for the redesigned KB8029 course"
  author: "Arne Elofsson"
  date: today
  chapters:
    - index.qmd
    - schedule.qmd
    - day01.qmd
    - href: notebooks/day01-math-in-code.ipynb
      text: "Day 1 — Notebook"
    - day02.qmd
    - href: notebooks/day02-tensors-and-a-first-class.ipynb
      text: "Day 2 — Notebook"
    - day03.qmd
    - href: notebooks/day03-databases-in-code.ipynb
      text: "Day 3 — Notebook"
    - day04.qmd
    - href: notebooks/day04-alignment-in-code.ipynb
      text: "Day 4 — Notebook"
    - day06.qmd
    - href: notebooks/day06-gradient-descent-xor.ipynb
      text: "Day 6 — Notebook"
    - references.qmd

format:
  html:
    theme: cosmo
    number-sections: true
    code-fold: false
    toc: true
    include-in-header:
      - text: <script src="js/quiz-widget.js"></script>

execute:
  enabled: false   # notebooks already contain saved outputs from class; don't re-run them at build time

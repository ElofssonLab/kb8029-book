project:
  type: book

  resources:
    - js/quiz-widget.js
    - js/dp-matrix.js
    - js/blast-search.js
    - js/hmm-viterbi.js
    - js/playground-embed.js
    - exams/*
    - kb8029.ics
    - open.html
    - watch.html
    - dp.html
    - blast.html
    - hmm.html
    # our own build of the TensorFlow Playground; see
    # tools/builders/build_playground.sh
    - playground/**

# The website's chapter list lives in _quarto-web.yml (the default profile);
# the single-PDF version uses _quarto-pdf.yml (quarto render --profile pdf).
profile:
  default: web

book:
  title: "Bioinformatics & Deep Learning — Course Notes"
  subtitle: "An open-access companion for the redesigned KB8029 course"
  author: "Arne Elofsson"
  page-footer:
    center: 'Found an error or something unclear? <a href="https://bioinfo.se/internal/kb8029-feedback/">Send feedback</a> (university login), open an <a href="https://github.com/ElofssonLab/kb8029-book/issues">issue on GitHub</a>, or email arne@bioinfo.se with the subject "KB8029 feedback". The course is open access, and your feedback improves it.'
  date: today

format:
  html:
    theme: cosmo
    number-sections: true
    code-fold: false
    toc: true
    include-in-header:
      - text: <script src="js/quiz-widget.js"></script>
      # The three interactive pages are also embedded in the chapters, in the
      # "Try it" boxes, so every chapter has to be able to call renderDP,
      # renderBLAST and renderHMM. Loaded here rather than per chapter for the
      # same reason the stylesheet is: a page that sets up its own machinery
      # drifts away from the other twelve. blast-search.js needs dp-matrix.js
      # ahead of it, because it borrows that file's BLOSUM62.
      - text: <script src="js/dp-matrix.js"></script>
      - text: <script src="js/blast-search.js"></script>
      - text: <script src="js/hmm-viterbi.js"></script>
      - text: <script src="js/playground-embed.js"></script>

execute:
  enabled: false   # notebooks already contain saved outputs from class; don't re-run them at build time

project:
  type: book

  resources:
    - js/quiz-widget.js
    - exams/*
    - kb8029.ics
    - open.html

# The website's chapter list lives in _quarto-web.yml (the default profile);
# the single-PDF version uses _quarto-pdf.yml (quarto render --profile pdf).
profile:
  default: web

book:
  title: "Bioinformatics & Deep Learning — Course Notes"
  subtitle: "An open-access companion for the redesigned KB8029 course"
  author: "Arne Elofsson"
  page-footer:
    center: 'Found an error or something unclear? <a href="https://bioinfo.se/internal/kb8029-feedback/">Send feedback</a> (university login), open an <a href="https://github.com/ElofssonLab/kb8029-book/issues">issue on GitHub</a>, or email arne@bioinfo.se with the subject "KB8029 feedback". The course is open access, and your feedback improves it.'
  date: today

format:
  html:
    theme: cosmo
    number-sections: true
    code-fold: false
    toc: true
    include-in-header:
      - text: <script src="js/quiz-widget.js"></script>

execute:
  enabled: false   # notebooks already contain saved outputs from class; don't re-run them at build time
